<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 1008 569" version="1.1" xmlns="http://www.w3.org/2000/svg" xml:space="preserve">
    <style>
        .grid { fill: none; stroke: #d1d9e0; stroke-width: 1px; }
        .slot { font: 700 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1a1a1a; }
        .note { font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #6b7280; }
        .plain { font: 400 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1a1a1a; }
    </style>

    <!-- side: persistent full-height column, outside the main grid -->
    <rect class="grid" x="1" y="1" width="170" height="567" />
    <text class="slot" x="15" y="284" dominant-baseline="middle">side</text>

    <!-- main grid outer border -->
    <rect class="grid" x="171" y="1" width="836" height="567" />

    <!-- top row: top-left / top-middle / top-right -->
    <path class="grid" d="M171,61 L1007,61" />
    <path class="grid" d="M449,1 L449,61" />
    <path class="grid" d="M729,1 L729,61" />
    <text class="slot" x="185" y="36" dominant-baseline="middle">top-left</text>
    <text class="slot" x="589" y="36" dominant-baseline="middle" text-anchor="middle">top-middle</text>
    <text class="slot" x="993" y="36" dominant-baseline="middle" text-anchor="end">top-right</text>

    <!-- left / right columns -->
    <path class="grid" d="M341,61 L341,388" />
    <path class="grid" d="M837,61 L837,388" />
    <path class="grid" d="M171,224 L341,224" />
    <path class="grid" d="M837,224 L1007,224" />
    <text class="slot" x="185" y="142" dominant-baseline="middle">left-top</text>
    <text class="slot" x="185" y="306" dominant-baseline="middle">left-bottom</text>
    <text class="slot" x="993" y="142" dominant-baseline="middle" text-anchor="end">right-top</text>
    <text class="slot" x="993" y="306" dominant-baseline="middle" text-anchor="end">right-bottom</text>

    <!-- banner: sits below the top row, centred between the left/right columns -->
    <rect class="grid" x="439" y="71" width="300" height="50" />
    <text class="slot" x="589" y="96" dominant-baseline="middle" text-anchor="middle">banner</text>

    <!-- actions (tablet/desktop): floating control centred above the bottom row -->
    <rect class="grid" x="464" y="280" width="250" height="60" />
    <text class="slot" x="589" y="302" dominant-baseline="middle" text-anchor="middle">actions</text>
    <text class="note" x="589" y="320" dominant-baseline="middle" text-anchor="middle">tablet/desktop</text>

    <!-- logo / bottom-right -->
    <path class="grid" d="M171,388 L1007,388" />
    <path class="grid" d="M449,388 L449,448" />
    <path class="grid" d="M171,448 L1007,448" />
    <text class="plain" x="185" y="418" dominant-baseline="middle">Logo</text>
    <text class="slot" x="993" y="418" dominant-baseline="middle" text-anchor="end">bottom-right</text>

    <!-- drawer (mobile only) -->
    <path class="grid" d="M171,508 L1007,508" />
    <text class="slot" x="589" y="470" dominant-baseline="middle" text-anchor="middle">drawer</text>
    <text class="note" x="589" y="488" dominant-baseline="middle" text-anchor="middle">mobile only</text>

    <!-- actions (mobile only) -->
    <text class="slot" x="589" y="530" dominant-baseline="middle" text-anchor="middle">actions</text>
    <text class="note" x="589" y="548" dominant-baseline="middle" text-anchor="middle">mobile only</text>
</svg>
