<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 1008 619" version="1.1" xmlns="http://www.w3.org/2000/svg" xml:space="preserve">
    <style>
        .grid { fill: none; stroke: #d1d9e0; stroke-width: 1px; }
        .slot { font: 700 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1a1a1a; }
        .note { font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #6b7280; }
        .plain { font: 400 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1a1a1a; }
    </style>

    <!-- header: full width, above the top row, flush against it — pushes everything below it down -->
    <rect class="grid" x="171" y="1" width="836" height="50" />
    <text class="slot" x="589" y="26" dominant-baseline="middle" text-anchor="middle">header</text>

    <!-- side: persistent full-height column, outside the main grid, spans header + main grid -->
    <rect class="grid" x="1" y="1" width="170" height="617" />
    <text class="slot" x="15" y="310" dominant-baseline="middle">side</text>

    <!-- main grid outer border -->
    <rect class="grid" x="171" y="51" width="836" height="567" />

    <!-- top row: top-left / top-middle / top-right -->
    <path class="grid" d="M171,111 L1007,111" />
    <path class="grid" d="M449,51 L449,111" />
    <path class="grid" d="M729,51 L729,111" />
    <text class="slot" x="185" y="86" dominant-baseline="middle">top-left</text>
    <text class="slot" x="589" y="86" dominant-baseline="middle" text-anchor="middle">top-middle</text>
    <text class="slot" x="993" y="86" dominant-baseline="middle" text-anchor="end">top-right</text>

    <!-- left / right columns -->
    <path class="grid" d="M341,111 L341,438" />
    <path class="grid" d="M837,111 L837,438" />
    <path class="grid" d="M171,274 L341,274" />
    <path class="grid" d="M837,274 L1007,274" />
    <text class="slot" x="185" y="192" dominant-baseline="middle">left-top</text>
    <text class="slot" x="185" y="356" dominant-baseline="middle">left-bottom</text>
    <text class="slot" x="993" y="192" dominant-baseline="middle" text-anchor="end">right-top</text>
    <text class="slot" x="993" y="356" dominant-baseline="middle" text-anchor="end">right-bottom</text>

    <!-- banner: sits below the top row, centred between the left/right columns -->
    <rect class="grid" x="439" y="121" width="300" height="50" />
    <text class="slot" x="589" y="146" dominant-baseline="middle" text-anchor="middle">banner</text>

    <!-- actions (tablet/desktop): floating control centred above the bottom row -->
    <rect class="grid" x="464" y="330" width="250" height="60" />
    <text class="slot" x="589" y="352" dominant-baseline="middle" text-anchor="middle">actions</text>
    <text class="note" x="589" y="370" dominant-baseline="middle" text-anchor="middle">tablet/desktop</text>

    <!-- logo / bottom-right -->
    <path class="grid" d="M171,438 L1007,438" />
    <path class="grid" d="M449,438 L449,498" />
    <path class="grid" d="M171,498 L1007,498" />
    <text class="plain" x="185" y="468" dominant-baseline="middle">Logo</text>
    <text class="slot" x="993" y="468" dominant-baseline="middle" text-anchor="end">bottom-right</text>

    <!-- drawer (mobile only) -->
    <path class="grid" d="M171,558 L1007,558" />
    <text class="slot" x="589" y="520" dominant-baseline="middle" text-anchor="middle">drawer</text>
    <text class="note" x="589" y="538" dominant-baseline="middle" text-anchor="middle">mobile only</text>

    <!-- actions (mobile only) -->
    <text class="slot" x="589" y="580" dominant-baseline="middle" text-anchor="middle">actions</text>
    <text class="note" x="589" y="598" dominant-baseline="middle" text-anchor="middle">mobile only</text>
</svg>
