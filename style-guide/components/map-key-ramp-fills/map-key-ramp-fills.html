<!--
  Specimen: Map key ramp — horizontal, stroked pattern fills (Low / Medium / High)

  Mirrors what KeyGroupItem.jsx + KeySvgRamp.jsx render for a ramp group whose entries have a
  stroke and a fill pattern: the <dl> gets im-c-map-key-list--has-stroke, which separates the
  bands with a gap. Each band's pattern tile is a userSpaceOnUse <pattern> offset 2px (the
  border width), and the border is a 4px stroke on a flush <rect> whose outer half the <svg>
  clips, leaving 2px — the same as the standard pattern symbol's border.

  Patterns are the production ones from src/config/patternConfig.js, with
  {{foregroundColor}} resolved by hand. Pattern ids are uniquified per light/dark stage by
  js/style-guide.js. A duplicated snapshot, not a live import — see style-guide/README.md.
-->
<div class="im-c-map-key im-c-map-key--has-groups">
  <section class="im-c-map-key__group" aria-labelledby="key-heading-risk">
    <h3 id="key-heading-risk" class="im-c-map-key__group-heading">Risk</h3>
    <dl class="im-c-map-key-list im-c-map-key-list--ramp im-c-map-key-list--ramp-horizontal im-c-map-key-list--has-stroke">
      <div class="im-c-map-key-list__item">
        <dt class="im-c-map-key-list__item-symbol">
          <svg xmlns="http://www.w3.org/2000/svg" class="im-c-map-key-symbol" aria-hidden="true" focusable="false">
            <defs>
              <pattern id="map-key-ramp-risk-low" patternUnits="userSpaceOnUse" x="2" y="2" width="16" height="16"><path d="M0 4.5V3.499h15.999V4.5H0zm0 7h15.999V12.5H0v-1.001z" fill="#0ca30c"/></pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#map-key-ramp-risk-low)" stroke="#0ca30c" stroke-width="4"/>
          </svg>
        </dt>
        <dd class="im-c-map-key-list__item-label">Low</dd>
      </div>
      <div class="im-c-map-key-list__item">
        <dt class="im-c-map-key-list__item-symbol">
          <svg xmlns="http://www.w3.org/2000/svg" class="im-c-map-key-symbol" aria-hidden="true" focusable="false">
            <defs>
              <pattern id="map-key-ramp-risk-medium" patternUnits="userSpaceOnUse" x="2" y="2" width="16" height="16"><path d="M0 8.707V7.293L7.293 0h1.414L16 7.293v1.414L8.707 16H7.293L0 8.707zM.707 8L8 15.293 15.293 8 8 .707.707 8z" fill="#fab219"/></pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#map-key-ramp-risk-medium)" stroke="#fab219" stroke-width="4"/>
          </svg>
        </dt>
        <dd class="im-c-map-key-list__item-label">Medium</dd>
      </div>
      <div class="im-c-map-key-list__item">
        <dt class="im-c-map-key-list__item-symbol">
          <svg xmlns="http://www.w3.org/2000/svg" class="im-c-map-key-symbol" aria-hidden="true" focusable="false">
            <defs>
              <pattern id="map-key-ramp-risk-high" patternUnits="userSpaceOnUse" x="2" y="2" width="16" height="16"><path d="M3.999 2A2 2 0 0 1 6 3.999C6 5.103 5.103 6 3.999 6a2 2 0 0 1-1.999-2.001A2 2 0 0 1 3.999 2zm0 7.999C5.103 10 6 10.897 6 12.001A2 2 0 0 1 3.999 14a2 2 0 0 1-1.999-1.999A2 2 0 0 1 3.999 10zM11.999 2A2 2 0 0 1 14 3.999C14 5.103 13.103 6 11.999 6S10 5.103 10 3.999A2 2 0 0 1 11.999 2zm0 7.999c1.104 0 2.001.897 2.001 2.001A2 2 0 0 1 11.999 14 2 2 0 0 1 10 12.001c0-1.104.897-2.001 1.999-2.001z" fill="#d03b3b"/></pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#map-key-ramp-risk-high)" stroke="#d03b3b" stroke-width="4"/>
          </svg>
        </dt>
        <dd class="im-c-map-key-list__item-label">High</dd>
      </div>
    </dl>
  </section>
</div>
