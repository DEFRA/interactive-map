<!--
  Specimen: Map key ramp — Risk example (Low / Medium / High), hatch + stroke

  Same im-c-map-key-list--ramp-horizontal mechanism as the map-key-ramp specimen (see
  map-key-ramp.scss) and the same group/section-title shell every ramp comes wrapped in.
  Reuses the same three patterns as the map-key/map-key-group specimens (horizontal-hatch /
  diagonal-cross-hatch / dot, duplicated from src/config/patternConfig.js) so this specimen
  can test the ramp's border, corner-rounding, and hatching together — same mechanism the
  original fill-kinds version of this specimen proved, just with Risk's own colours instead
  of the DemoMapPolygons land-use ones.

  Fill/pattern foreground and border stroke are both the same status colour, on light
  backgrounds — matching the real DemoMapPolygons sublayers, whose stroke and
  fillPatternForegroundColor are the same value (e.g. Arable's are both #6D4C41), not two
  different colours. Stroke width is 2, matching KEY_BORDER_PATH's own stroke-width. Flips
  to white on dark backgrounds. The border here is a <rect stroke="">, same as the old
  fill-kinds version, not the hand-drawn <path> production's KEY_BORDER_PATH uses, so
  map-key.scss's inherited dark-mode rule (which targets path[stroke]) doesn't cover it —
  map-key-ramp-fills.scss adds the equivalent rect[stroke] rule back for that reason.

  Each <pattern> has x="1", matching the border rect's own x/y inset in map-key-ramp.scss
  (added there so the stroke's full width lands inside the box rather than being clipped by
  overflow: hidden) — patternUnits="userSpaceOnUse" ties the tile's origin to the ambient
  coordinate space, not to the rect's own bounding box, so without this the pattern's origin
  would stay at the old (0,0) while the rect it fills starts at (1,1).

  y is 2, not 1: the rect's visible height is 18 (20px band minus the 2px stroke inset) and
  the tile is 16 tall, leaving a 2px remainder each cycle. At y="1" (flush with the rect's
  own top edge) that whole 2px remainder falls at the bottom as a blank gap below both hatch
  bars — reading as the pattern sitting high in the band rather than filling it. Shifting the
  origin down by half the remainder (1px) splits it evenly, top and bottom, instead.
-->
<div class="im-c-map-key im-c-map-key--has-groups">
  <section class="im-c-map-key__group" aria-labelledby="key-heading-risk">
    <h3 id="key-heading-risk" class="im-c-map-key__group-heading">Risk</h3>
    <dl class="im-c-map-key-list im-c-map-key-list--ramp-horizontal">
      <div class="im-c-map-key-list__item">
        <dt class="im-c-map-key-list__item-symbol">
          <svg class="im-c-map-key-symbol" aria-hidden="true" focusable="false">
            <defs>
              <pattern id="map-key-ramp-risk-low" patternUnits="userSpaceOnUse" x="1" y="2" width="16" height="16">
                <path d="M0 4.5V3.499h15.999V4.5H0zm0 7h15.999V12.5H0v-1.001z" fill="#0ca30c"/>
              </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#map-key-ramp-risk-low)" stroke="#0ca30c" stroke-width="2"/>
          </svg>
        </dt>
        <dd class="im-c-map-key-list__item-label">Low</dd>
      </div>
      <div class="im-c-map-key-list__item">
        <dt class="im-c-map-key-list__item-symbol">
          <svg class="im-c-map-key-symbol" aria-hidden="true" focusable="false">
            <defs>
              <pattern id="map-key-ramp-risk-medium" patternUnits="userSpaceOnUse" x="1" y="2" width="16" height="16">
                <path d="M0 8.707V7.293L7.293 0h1.414L16 7.293v1.414L8.707 16H7.293L0 8.707zM.707 8L8 15.293 15.293 8 8 .707.707 8z" fill="#fab219"/>
              </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#map-key-ramp-risk-medium)" stroke="#fab219" stroke-width="2"/>
          </svg>
        </dt>
        <dd class="im-c-map-key-list__item-label">Medium</dd>
      </div>
      <div class="im-c-map-key-list__item">
        <dt class="im-c-map-key-list__item-symbol">
          <svg class="im-c-map-key-symbol" aria-hidden="true" focusable="false">
            <defs>
              <pattern id="map-key-ramp-risk-high" patternUnits="userSpaceOnUse" x="1" y="2" width="16" height="16">
                <path d="M3.999 2A2 2 0 0 1 6 3.999C6 5.103 5.103 6 3.999 6a2 2 0 0 1-1.999-2.001A2 2 0 0 1 3.999 2zm0 7.999C5.103 10 6 10.897 6 12.001A2 2 0 0 1 3.999 14a2 2 0 0 1-1.999-1.999A2 2 0 0 1 3.999 10zM11.999 2A2 2 0 0 1 14 3.999C14 5.103 13.103 6 11.999 6S10 5.103 10 3.999A2 2 0 0 1 11.999 2zm0 7.999c1.104 0 2.001.897 2.001 2.001A2 2 0 0 1 11.999 14 2 2 0 0 1 10 12.001c0-1.104.897-2.001 1.999-2.001z" fill="#d03b3b"/>
              </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#map-key-ramp-risk-high)" stroke="#d03b3b" stroke-width="2"/>
          </svg>
        </dt>
        <dd class="im-c-map-key-list__item-label">High</dd>
      </div>
    </dl>
  </section>
</div>
