<!--
  Specimen: Map key ramp — vertical, solid and stroked

  Mirrors what KeyGroupItem.jsx + KeySvgRamp.jsx render for a ramp group whose labels don't all
  fit on one line under their bands: useRampOrientation.js swaps --ramp-horizontal for
  im-c-map-key-list--ramp-vertical. Bands are 20px wide and fill their whole row, so labels
  keep the same 40px spacing as a standard group.

  Elevation: solid fills, no stroke, so the bands touch. Fills come from the sample tokens in
  map-key-ramp.scss (data-ramp="elevation").
  Land covers: the demo's land cover sublayers (demo/js/index.js), each with a stroke and a
  fill pattern, so the <dl> gets --has-stroke and the bands are separated by a gap.

  A duplicated snapshot, not a live import — see style-guide/README.md.
-->
<div class="im-c-map-key im-c-map-key--has-groups">
  <section class="im-c-map-key__group" aria-labelledby="key-heading-elevation-vertical">
    <h3 id="key-heading-elevation-vertical" class="im-c-map-key__group-heading">Elevation</h3>
    <dl class="im-c-map-key-list im-c-map-key-list--ramp im-c-map-key-list--ramp-vertical" data-ramp="elevation">
      <div class="im-c-map-key-list__item">
        <dt class="im-c-map-key-list__item-symbol">
          <svg xmlns="http://www.w3.org/2000/svg" class="im-c-map-key-symbol" aria-hidden="true" focusable="false">
            <rect width="100%" height="100%" fill="none"/>
          </svg>
        </dt>
        <dd class="im-c-map-key-list__item-label">0 to 50 metres</dd>
      </div>
      <div class="im-c-map-key-list__item">
        <dt class="im-c-map-key-list__item-symbol">
          <svg xmlns="http://www.w3.org/2000/svg" class="im-c-map-key-symbol" aria-hidden="true" focusable="false">
            <rect width="100%" height="100%" fill="none"/>
          </svg>
        </dt>
        <dd class="im-c-map-key-list__item-label">50 to 100 metres</dd>
      </div>
      <div class="im-c-map-key-list__item">
        <dt class="im-c-map-key-list__item-symbol">
          <svg xmlns="http://www.w3.org/2000/svg" class="im-c-map-key-symbol" aria-hidden="true" focusable="false">
            <rect width="100%" height="100%" fill="none"/>
          </svg>
        </dt>
        <dd class="im-c-map-key-list__item-label">100 to 200 metres</dd>
      </div>
      <div class="im-c-map-key-list__item">
        <dt class="im-c-map-key-list__item-symbol">
          <svg xmlns="http://www.w3.org/2000/svg" class="im-c-map-key-symbol" aria-hidden="true" focusable="false">
            <rect width="100%" height="100%" fill="none"/>
          </svg>
        </dt>
        <dd class="im-c-map-key-list__item-label">200 to 400 metres</dd>
      </div>
      <div class="im-c-map-key-list__item">
        <dt class="im-c-map-key-list__item-symbol">
          <svg xmlns="http://www.w3.org/2000/svg" class="im-c-map-key-symbol" aria-hidden="true" focusable="false">
            <rect width="100%" height="100%" fill="none"/>
          </svg>
        </dt>
        <dd class="im-c-map-key-list__item-label">Over 400 metres</dd>
      </div>
    </dl>
  </section>
  <section class="im-c-map-key__group" aria-labelledby="key-heading-land-covers">
    <h3 id="key-heading-land-covers" class="im-c-map-key__group-heading">Land covers</h3>
    <dl class="im-c-map-key-list im-c-map-key-list--ramp im-c-map-key-list--ramp-vertical im-c-map-key-list--has-stroke">
      <div class="im-c-map-key-list__item">
        <dt class="im-c-map-key-list__item-symbol">
          <svg xmlns="http://www.w3.org/2000/svg" class="im-c-map-key-symbol" aria-hidden="true" focusable="false">
            <defs>
              <pattern id="map-key-ramp-land-permanent-grassland" patternUnits="userSpaceOnUse" x="2" y="2" width="16" height="16"><path d="M0 8.707V7.293L7.293 0h1.414L16 7.293v1.414L8.707 16H7.293L0 8.707zM.707 8L8 15.293 15.293 8 8 .707.707 8z" fill="#00897B"/></pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#map-key-ramp-land-permanent-grassland)" stroke="#00897B" stroke-width="4"/>
          </svg>
        </dt>
        <dd class="im-c-map-key-list__item-label">Permanent grassland</dd>
      </div>
      <div class="im-c-map-key-list__item">

          <svg xmlns="http://www.w3.org/2000/svg" class="im-c-map-key-symbol" aria-hidden="true" focusable="false">
            <defs>
              <pattern id="map-key-ramp-land-woodland" patternUnits="userSpaceOnUse" x="2" y="2" width="16" height="16"><path d="M3.999 2A2 2 0 0 1 6 3.999C6 5.103 5.103 6 3.999 6a2 2 0 0 1-1.999-2.001A2 2 0 0 1 3.999 2zm0 7.999C5.103 10 6 10.897 6 12.001A2 2 0 0 1 3.999 14a2 2 0 0 1-1.999-1.999A2 2 0 0 1 3.999 10zM11.999 2A2 2 0 0 1 14 3.999C14 5.103 13.103 6 11.999 6S10 5.103 10 3.999A2 2 0 0 1 11.999 2zm0 7.999c1.104 0 2.001.897 2.001 2.001A2 2 0 0 1 11.999 14 2 2 0 0 1 10 12.001c0-1.104.897-2.001 1.999-2.001z" fill="#2E7D32"/></pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#map-key-ramp-land-woodland)" stroke="#2E7D32" stroke-width="4"/>
          </svg>
        </dt>
        <dd class="im-c-map-key-list__item-label">Woodland</dd>
      </div>
      <div class="im-c-map-key-list__item">
        <dt class="im-c-map-key-list__item-symbol">
          <svg xmlns="http://www.w3.org/2000/svg" class="im-c-map-key-symbol" aria-hidden="true" focusable="false">
            <defs>
              <pattern id="map-key-ramp-land-arable" patternUnits="userSpaceOnUse" x="2" y="2" width="16" height="16"><path d="M0 4.5V3.499h15.999V4.5H0zm0 7h15.999V12.5H0v-1.001z" fill="#6D4C41"/></pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#map-key-ramp-land-arable)" stroke="#6D4C41" stroke-width="4"/>
          </svg>
        </dt>
        <dd class="im-c-map-key-list__item-label">Arable</dd>
      </div>
      <div class="im-c-map-key-list__item">
        <dt class="im-c-map-key-list__item-symbol">
          <svg xmlns="http://www.w3.org/2000/svg" class="im-c-map-key-symbol" aria-hidden="true" focusable="false">
            <defs>
              <pattern id="map-key-ramp-land-farmyards" patternUnits="userSpaceOnUse" x="2" y="2" width="16" height="16"><path d="M16 8.707V7.293L7.293 16h1.414L16 8.707zm-16 0L8.707 0H7.293L0 7.293v1.414z" fill="#6A1B9A"/></pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#map-key-ramp-land-farmyards)" stroke="#6A1B9A" stroke-width="4"/>
          </svg>
        </dt>
        <dd class="im-c-map-key-list__item-label">Farmyards</dd>
      </div>
      <div class="im-c-map-key-list__item">
        <dt class="im-c-map-key-list__item-symbol">
          <svg xmlns="http://www.w3.org/2000/svg" class="im-c-map-key-symbol" aria-hidden="true" focusable="false">
            <defs>
              <pattern id="map-key-ramp-land-others" patternUnits="userSpaceOnUse" x="2" y="2" width="16" height="16"><path d="M3.501 16.001V0h1v16.001h-1zm7.998 0V0h1v16.001h-1z" fill="#1565C0"/></pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#map-key-ramp-land-others)" stroke="#1565C0" stroke-width="4"/>
          </svg>
        </dt>
        <dd class="im-c-map-key-list__item-label">Others</dd>
      </div>
    </dl>
  </section>
</div>
