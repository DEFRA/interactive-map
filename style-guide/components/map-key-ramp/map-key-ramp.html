<!--
  Specimen: Map key ramp — horizontal, solid fills

  Mirrors what KeyGroupItem.jsx + KeySvgRamp.jsx render for a group with groupStyle: 'ramp'
  whose labels all fit on one line: the shared <dl> gets im-c-map-key-list--ramp plus
  im-c-map-key-list--ramp-horizontal (chosen by useRampOrientation.js), and each band is a
  viewBox-less <svg> with a full-size <rect>. No entry has a stroke, so there's no
  --has-stroke modifier and the bands touch.

  Production writes each band's fill as an attribute on its <rect>; here the fills come from
  the sample tokens in map-key-ramp.scss (data-ramp="elevation") so they can change with the
  light/dark panels. A duplicated snapshot, not a live import — see style-guide/README.md.
-->
