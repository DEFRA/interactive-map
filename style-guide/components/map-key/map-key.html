<!--
  Specimen: Map key — base component (im-c-map-key), three pattern-fill items

  Mirrors what plugins/map-key/src/components/Key/KeyItem.jsx + KeySvg.jsx +
  KeySvgPattern.jsx render for a flat (no groups) key with pattern-fill datasets, on the
  (unmerged) IM-482 branch — a plain <div class="im-c-map-key-list__item"> per item, no
  per-item <dl> (see map-key.scss for why: each item used to be its own separate <dl>,
  which broke :first-child rules scoped under a group). This is a duplicated snapshot, not
  a live import — see map-key.scss and style-guide/README.md for the
  duplicate → approve → port-back workflow.

  Source data — the three sublayer styles in demo/DemoMapPolygons.js (fillPatternBackgroundColor
  is 'transparent' for all three):
    Arable              stroke / fillPatternForegroundColor #6D4C41, fillPattern 'horizontal-hatch'
    Permanent grassland stroke / fillPatternForegroundColor #00897B, fillPattern 'diagonal-cross-hatch'
    Woodland            stroke / fillPatternForegroundColor #2E7D32, fillPattern 'dot'

  Each symbol's border path is KEY_BORDER_PATH (src/utils/patternUtils.js); each fill path is
  its named pattern from src/config/patternConfig.js. {{foregroundColor}}/{{backgroundColor}}
  tokens are resolved by hand, as patternRegistry.getKeyPatternPaths() would resolve them.

  If this ever looks wrong next to the real map key, re-derive it from those source files —
  this fragment is a snapshot of their output, not the other way round.
-->
