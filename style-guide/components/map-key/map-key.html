<!--
  Specimen: Map key — base component (im-c-map-key), three pattern-fill items

  Mirrors what plugins/map-key/src/components/Key/Key.jsx + KeyItem.jsx + KeySvgPattern.jsx
  render for a flat key (no groups) with pattern-fill datasets: a plain
  <div class="im-c-map-key-list__item"> per item, each with a 20×20 symbol whose border path
  is KEY_BORDER_PATH (src/utils/patternUtils.js) and whose fill is one 16×16 tile of its named
  pattern (src/config/patternConfig.js), with {{foregroundColor}}/{{backgroundColor}}
  resolved by hand as patternRegistry.getKeyPatternPaths() would.

  Colours and patterns are the land cover sublayers in demo/DemoMapPolygons.js:
    Arable              #6D4C41  horizontal-hatch
    Permanent grassland #00897B  diagonal-cross-hatch
    Woodland            #2E7D32  dot

  A duplicated snapshot, not a live import — see style-guide/README.md.
-->
